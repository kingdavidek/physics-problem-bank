<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 10">
<!-- Story props (E10 phase 8, docs/ZORP_ARRIVAL_AND_CELEBRATIONS_PLAN.md A6). An inert template like stage-props.svg: static/js/story-chapters.js
     fetches it once, parses it with DOMParser and hands it to the stage (pbStage.addProps), which clones each svg[id^="st-"] into the stage.
     Colours are fixed (the stage is night sky in both themes); every move is a CSS transform or opacity on a sty- class (static/css/story.css),
     so nothing here runs. No script, links or foreign content. -->
<svg id="st-rock" viewBox="0 0 240 200">
  <g class="sty-rock">
    <ellipse cx="120" cy="188" rx="86" ry="8" fill="#000000" opacity="0.25"/>
    <path d="M30 120C22 78 62 34 118 30C170 26 214 58 212 108C210 150 176 176 124 176C72 176 36 160 30 120Z" fill="#7c6f9b"/>
    <path d="M52 92C60 62 92 44 124 42C96 56 76 82 74 118C60 114 50 104 52 92Z" fill="#a69bc4" opacity="0.6"/>
    <path d="M150 170C186 164 208 138 208 108C196 132 170 148 130 150Z" fill="#4c3f6e" opacity="0.5"/>
    <circle cx="176" cy="70" r="9" fill="#5d5080" opacity="0.6"/>
    <rect x="58" y="62" width="124" height="78" rx="12" fill="#fffbeb"/>
    <text x="120" y="102" font-size="30" font-weight="800" text-anchor="middle" fill="#1c2430">6 × 7</text>
    <text class="sty-q" x="120" y="130" font-size="22" font-weight="800" text-anchor="middle" fill="#64748b">= ?</text>
    <text class="sty-a" x="120" y="130" font-size="22" font-weight="800" text-anchor="middle" fill="#16a34a">= 42</text>
    <g class="sty-ok"><circle cx="182" cy="62" r="16" fill="#16a34a"/><path d="M174 62L180 68L191 56" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></g>
  </g>
</svg>

