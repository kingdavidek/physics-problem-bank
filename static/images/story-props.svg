  <rect x="30" y="26" width="160" height="246" rx="6" fill="#fde68a"/>
  <g class="sty-glow"><rect x="30" y="26" width="160" height="246" rx="6" fill="#fff7d6"/><path d="M60 272L110 120L160 272Z" fill="#fde047" opacity="0.7"/></g>
  <g class="sty-leaf">
    <rect x="30" y="26" width="160" height="246" rx="6" fill="#0d9488"/>
    <rect x="46" y="44" width="128" height="86" rx="8" fill="#0f766e"/>
    <rect x="46" y="150" width="128" height="104" rx="8" fill="#0f766e"/>
    <rect x="66" y="56" width="88" height="62" rx="10" fill="#fffbeb"/>
    <text x="110" y="88" font-size="24" font-weight="800" text-anchor="middle" fill="#1c2430">8 + 5</text>
    <text class="sty-q" x="110" y="110" font-size="18" font-weight="800" text-anchor="middle" fill="#64748b">= ?</text>
    <text class="sty-a" x="110" y="110" font-size="18" font-weight="800" text-anchor="middle" fill="#16a34a">= 13</text>
    <circle cx="156" cy="214" r="9" fill="#fbbf24"/>
  </g>
  <g class="sty-ok"><circle cx="110" cy="146" r="16" fill="#16a34a"/><path d="M102 146L108 152L119 140" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/></g>
</svg>

