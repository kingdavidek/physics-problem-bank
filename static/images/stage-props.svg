<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 10 10">
<!-- Stage props (E10, docs/ZORP_ARRIVAL_AND_CELEBRATIONS_PLAN.md 6.1). An inert template: static/js/zorp-stage.js fetches it
     once, parses it with DOMParser and clones each svg[id^="st-"] into the stage. Colours are fixed (the stage is night sky in both themes);
     every move is a CSS transform or opacity on a class, so nothing here runs. No script, no links, no foreign content. -->
<svg id="st-planet" viewBox="0 0 320 240">
  <defs>
    <clipPath id="st-planet-clip"><circle cx="160" cy="120" r="70"/></clipPath>
    <clipPath id="st-belt-front"><rect x="-170" y="0" width="340" height="60" transform="translate(160 120) rotate(-12)"/></clipPath>
  </defs>
  <g transform="translate(160 120) rotate(-12) scale(1 0.3)">
    <circle r="136" fill="none" stroke="#fbbf24" stroke-width="20" opacity="0.12"/>
    <circle class="st-belt-glow" r="136" fill="none" stroke="#fbbf24" stroke-width="26"/>
    <circle r="136" fill="none" stroke="#fbbf24" stroke-width="5" stroke-dasharray="2 10" stroke-linecap="round" opacity="0.6"/>
    <g class="st-orbit"><text class="st-g" x="136.0" y="0.0">7</text><text class="st-g" x="122.5" y="59.0">π</text><text class="st-g" x="84.8" y="106.3">+</text><text class="st-g" x="30.3" y="132.6">3</text><text class="st-g" x="-30.3" y="132.6">×</text><text class="st-g" x="-84.8" y="106.3">√</text><text class="st-g" x="-122.5" y="59.0">9</text><text class="st-g" x="-136.0" y="0.0">=</text><text class="st-g" x="-122.5" y="-59.0">2</text><text class="st-g" x="-84.8" y="-106.3">÷</text><text class="st-g" x="-30.3" y="-132.6">∞</text><text class="st-g" x="30.3" y="-132.6">x</text><text class="st-g" x="84.8" y="-106.3">5</text><text class="st-g" x="122.5" y="-59.0">%</text></g>
  </g>
  <g class="st-planet-body">
    <circle cx="160" cy="120" r="70" fill="#8b5cf6"/>
    <g clip-path="url(#st-planet-clip)">
      <path d="M80 86Q160 70 240 86V100Q160 84 80 100Z" fill="#c4b5fd" opacity="0.55"/>
      <path d="M80 122Q160 106 240 122V142Q160 126 80 142Z" fill="#c4b5fd" opacity="0.4"/>
      <path d="M80 160Q160 146 240 160V170Q160 156 80 170Z" fill="#c4b5fd" opacity="0.5"/>
      <circle cx="186" cy="146" r="12" fill="#4c1d95" opacity="0.5"/>
      <circle cx="130" cy="104" r="7" fill="#4c1d95" opacity="0.45"/>
      <circle cx="214" cy="150" r="84" fill="#4c1d95" opacity="0.35"/>
    </g>
    <ellipse cx="130" cy="84" rx="24" ry="12" fill="#ffffff" opacity="0.2" transform="rotate(-28 130 84)"/>
  </g>
  <g clip-path="url(#st-belt-front)">
    <g transform="translate(160 120) rotate(-12) scale(1 0.3)">
      <circle r="136" fill="none" stroke="#fbbf24" stroke-width="20" opacity="0.12"/>
      <circle class="st-belt-glow" r="136" fill="none" stroke="#fbbf24" stroke-width="26"/>
      <circle r="136" fill="none" stroke="#fbbf24" stroke-width="5" stroke-dasharray="2 10" stroke-linecap="round" opacity="0.6"/>
      <g class="st-orbit"><text class="st-g" x="136.0" y="0.0">7</text><text class="st-g" x="122.5" y="59.0">π</text><text class="st-g" x="84.8" y="106.3">+</text><text class="st-g" x="30.3" y="132.6">3</text><text class="st-g" x="-30.3" y="132.6">×</text><text class="st-g" x="-84.8" y="106.3">√</text><text class="st-g" x="-122.5" y="59.0">9</text><text class="st-g" x="-136.0" y="0.0">=</text><text class="st-g" x="-122.5" y="-59.0">2</text><text class="st-g" x="-84.8" y="-106.3">÷</text><text class="st-g" x="-30.3" y="-132.6">∞</text><text class="st-g" x="30.3" y="-132.6">x</text><text class="st-g" x="84.8" y="-106.3">5</text><text class="st-g" x="122.5" y="-59.0">%</text></g>
    </g>
  </g>
</svg>

<svg id="st-ship" viewBox="0 0 300 180">
