  <rect x="68" y="50" width="172" height="86" rx="26" fill="none" stroke="#475569" stroke-width="9"/>
  <rect x="60" y="124" width="188" height="16" rx="8" fill="#e2e8f0"/>
  <g fill="#475569"><circle cx="82" cy="132" r="2.5"/><circle cx="154" cy="132" r="2.5"/><circle cx="226" cy="132" r="2.5"/></g>
</svg>

<svg id="st-logbook" viewBox="0 0 240 170">
  <ellipse cx="120" cy="160" rx="96" ry="7" fill="#000000" opacity="0.25"/>
  <g class="st-book-shut">
    <rect x="72" y="26" width="96" height="128" rx="8" fill="#c2410c"/>
    <rect x="72" y="26" width="14" height="128" rx="6" fill="#9a3412"/>
    <path d="M128 62L134 76L149 77L137 87L141 102L128 93L115 102L119 87L107 77L122 76Z" fill="#fbbf24"/>
    <rect x="98" y="116" width="58" height="8" rx="4" fill="#9a3412"/>
  </g>
  <g class="st-book-open">
    <rect x="14" y="30" width="212" height="126" rx="10" fill="#c2410c"/>
    <path class="st-page-l" d="M120 40C96 32 52 32 22 40V150C52 142 96 142 120 150Z" fill="#fffbeb"/>
    <path class="st-page-r" d="M120 40C144 32 188 32 218 40V150C188 142 144 142 120 150Z" fill="#fffbeb"/>
