    <path class="st-note" d="M140 104L152 116L176 90" fill="none" stroke="#16a34a" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    <path class="st-note" d="M190 98L194 107L204 108L196 114L199 124L190 118L181 124L184 114L176 108L186 107Z" fill="#fbbf24"/>
    <path class="st-note" d="M38 124Q48 116 58 124T78 124T98 124" fill="none" stroke="#1c2430" stroke-width="3" stroke-linecap="round" opacity="0.7"/>
  </g>
</svg>

<svg id="st-card" viewBox="0 0 240 210">
  <g class="st-card-main">
    <rect x="10" y="10" width="220" height="128" rx="16" fill="#fff"/>
    <rect x="10" y="10" width="220" height="30" rx="15" fill="#e0f2fe"/>
    <text x="28" y="30" font-size="13" font-weight="700" fill="#64748b">Question</text>
    <text x="28" y="72" font-size="24" font-weight="700" fill="#1c2430">x + 7 = 12</text>
    <rect x="28" y="88" width="96" height="36" rx="9" fill="none" stroke="#64748b" stroke-width="2"/>
    <text class="st-ans st-ans-a" x="44" y="113" font-size="20" font-weight="700" fill="#1c2430">4</text>
    <text class="st-ans st-ans-b" x="44" y="113" font-size="20" font-weight="700" fill="#1c2430">5</text>
    <g class="st-cross"><circle cx="152" cy="106" r="15" fill="#f59e0b"/><path d="M146 100L158 112M158 100L146 112" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/></g>
    <g class="st-tick"><circle cx="152" cy="106" r="15" fill="#16a34a"/><path d="M145 106L150 111L159 101" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></g>
  </g>
  <g class="st-hint">
    <rect x="10" y="148" width="220" height="54" rx="14" fill="#fef3c7"/>
    <circle cx="32" cy="170" r="10" fill="#fbbf24"/>
    <rect x="28" y="180" width="8" height="6" rx="2" fill="#64748b"/>
    <text x="52" y="168" font-size="12" font-weight="700" fill="#64748b">Hint</text>
    <text x="52" y="188" font-size="14" fill="#1c2430">Take 7 from both sides.</text>
  </g>
</svg>
</svg>
