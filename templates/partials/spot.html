{#
  Empty-state spot illustrations (Phase U5.7, docs/UI_REDESIGN.md §8.7).

  Flat, two-tone, brand palette. Inline so CSS variables resolve.
  Names: search, friends, offline, caught-up.
#}

{% macro spot(name, extra_class='') -%}
<svg class="empty-spot empty-spot--{{ name }}{% if extra_class %} {{ extra_class }}{% endif %}" viewBox="0 0 160 120" aria-hidden="true" focusable="false">
  {% if name == 'search' %}
  <ellipse cx="80" cy="68" rx="64" ry="38" fill="var(--brand-100)"/>
  <rect x="36" y="26" width="76" height="56" rx="10" fill="var(--surface)" stroke="var(--brand-300)" stroke-width="2"/>
  <path d="M50 42h48M50 54h28" fill="none" stroke="var(--brand-200)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="104" cy="78" r="16" fill="var(--brand-50)" stroke="var(--brand-600)" stroke-width="3"/>
  <path d="M116 90l12 12" fill="none" stroke="var(--brand-600)" stroke-width="3.5" stroke-linecap="round"/>
  {% elif name == 'friends' %}
  <ellipse cx="80" cy="70" rx="64" ry="36" fill="var(--brand-100)"/>
  <circle cx="64" cy="46" r="14" fill="var(--brand-200)"/>
  <path d="M40 90c0-15 11-24 24-24s24 9 24 24" fill="var(--brand-200)"/>
  <circle cx="98" cy="44" r="15" fill="var(--brand-500)"/>
  <path d="M74 90c0-16 11-26 24-26s24 10 24 26" fill="var(--brand-500)"/>
  {% elif name == 'offline' %}
  <ellipse cx="80" cy="68" rx="64" ry="38" fill="var(--brand-100)"/>
  <path d="M52 78c-12 0-18-10-10-18 0-12 16-16 22-6 8-10 30-8 30 8 10 0 14 12 4 16H52z" fill="var(--brand-50)" stroke="var(--brand-600)" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M58 86l44-44" fill="none" stroke="var(--brand-600)" stroke-width="3.5" stroke-linecap="round"/>
  <circle cx="58" cy="86" r="3" fill="var(--brand-500)"/>
  <circle cx="102" cy="42" r="3" fill="var(--brand-500)"/>
  {% elif name == 'caught-up' %}
  <ellipse cx="80" cy="70" rx="64" ry="36" fill="var(--brand-100)"/>
  <rect x="52" y="30" width="56" height="40" rx="8" fill="var(--brand-200)"/>
  <rect x="46" y="36" width="56" height="40" rx="8" fill="var(--brand-50)" stroke="var(--brand-300)" stroke-width="2"/>
  <rect x="40" y="42" width="56" height="40" rx="8" fill="var(--surface)" stroke="var(--brand-400)" stroke-width="2"/>
  <circle cx="104" cy="78" r="16" fill="var(--brand-500)"/>
  <path d="M97 78l5 5 10-11" fill="none" stroke="var(--text-on-brand)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  {% endif %}
</svg>
{%- endmacro %}
