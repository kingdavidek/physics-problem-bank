{% extends "base.html" %}
{% block title %}Forgot password – Problem Bank{% endblock %}

{% block content %}
<div class="page-shell auth-page">
<div class="auth-card">
    <div class="auth-card-brand">
        <h1>Forgot password</h1>
        <p class="auth-card-tagline">We’ll send a reset link if that email is on an account.</p>
    </div>
    <div class="auth-card-body">
        {% if notice %}
        <p class="auth-alert" role="status">{{ notice }}</p>
        {% endif %}
        <form method="POST" class="auth-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" name="email" id="email" autocomplete="email" required>
            </div>
            <div class="auth-form-actions">
                <button type="submit" class="btn btn-primary btn-lg btn-block">Send reset link</button>
            </div>
            <p class="auth-switch"><a href="{{ url_for('login') }}">Back to log in</a></p>
        </form>
    </div>
</div>
</div>
{% endblock %}
