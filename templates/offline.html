{% extends "base.html" %}
{% from "partials/buddy.html" import buddy_mascot %}
{% block title %}Offline – Problem Bank{% endblock %}

{% block content %}
<div class="page-shell offline-page">
  <section class="section-panel status-page-card">
    <div class="section-panel-body">
      <div class="empty-state">
        <!-- E7 Phase 4: rendered with data-face="sleep" directly (not via zorp-motion.js's
             `play('sleep', ...)`), since this page is precached for offline/anonymous use and
             zorp-motion.js only loads for authenticated/preview sessions (templates/base.html).
             data-face="sleep" matches none of chrome.css's .study-buddy-face[data-face="…"]
             selectors, so every .buddy-face group (display:none by default) stays hidden —
             a blank, eyes-closed-look face, with zero JS dependency. -->
        <span class="study-buddy-face pb-zorp-small" id="offline-zorp" data-buddy-face data-face="sleep" aria-hidden="true">{{ buddy_mascot() }}</span>
        <h1>No signal here — your saved lessons still work.</h1>
        <a href="/" class="btn btn-primary" id="offline-retry">Try again</a>
      </div>
    </div>
  </section>
</div>
<script src="{{ url_for('static', filename='js/offline-retry.js') }}?v=1" defer></script>
{% endblock %}
