{% extends "base.html" %}
{% from "partials/buddy.html" import buddy_mascot %}
{% block title %}Offline – Problem Bank{% endblock %}

{% block content %}
<div class="page-shell offline-page">
  <section class="section-panel status-page-card">
    <div class="section-panel-body">
      <div class="empty-state">
        <!-- E8 Phase 1: the sleep preset is drawn server-side (closed eyes, sleepy mouth, zzz),
             with data-face="sleep" on the host. No JS dependency: zorp-motion.js only loads for
             authenticated/preview sessions, and this page is precached for offline use. -->
        <span class="study-buddy-face pb-zorp-small" id="offline-zorp" data-buddy-face data-face="sleep" aria-hidden="true">{{ buddy_mascot(face='sleep') }}</span>
        <h1>No signal here — your saved lessons still work.</h1>
        <a href="/" class="btn btn-primary" id="offline-retry">Try again</a>
      </div>
    </div>
  </section>
</div>
<script src="{{ url_for('static', filename='js/offline-retry.js') }}?v=1" defer></script>
{% endblock %}
