{% extends "base.html" %}
{% block title %}Reset password – Problem Bank{% endblock %}

{% block content %}
<div class="page-shell auth-page">
<div class="auth-card">
    <div class="auth-card-brand">
        <h1>Choose a new password</h1>
    </div>
    <div class="auth-card-body">
        {% if error %}
        <p class="auth-alert auth-alert--error" role="alert">{{ error }}</p>
        {% endif %}
        {% if not invalid %}
        <form method="POST" class="auth-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-group">
                <label for="password">New password</label>
                <input type="password" name="password" id="password" autocomplete="new-password" minlength="8" required>
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm password</label>
                <input type="password" name="confirm_password" id="confirm_password" autocomplete="new-password" minlength="8" required>
            </div>
            <div class="auth-form-actions">
                <button type="submit" class="btn btn-primary btn-lg btn-block">Update password</button>
            </div>
        </form>
        {% else %}
        <p class="auth-switch"><a href="{{ url_for('forgot_password') }}">Request a new link</a></p>
        {% endif %}
    </div>
</div>
</div>
{% endblock %}
